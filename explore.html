<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Explore - Calung Banyumas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              jakarta: ["Plus Jakarta Sans", "sans-serif"],
            },
            colors: {
              primary: "#14b8a6",
              "primary-dark": "#0d9488",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      /* Pulsing hotspot animation */
      @keyframes pulse-ring {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      .hotspot {
        position: absolute;
        width: 24px;
        height: 24px;
        cursor: pointer;
        z-index: 10;
      }

      .hotspot-inner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 14px;
        height: 14px;
        background: white;
        border: 3px solid #14b8a6;
        border-radius: 50%;
        z-index: 2;
        transition: all 0.3s ease;
      }

      .hotspot:hover .hotspot-inner {
        transform: translate(-50%, -50%) scale(1.2);
        box-shadow: 0 0 12px rgba(20, 184, 166, 0.5);
      }

      .hotspot-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 14px;
        height: 14px;
        border: 2px solid #14b8a6;
        border-radius: 50%;
        animation: pulse-ring 1.5s ease-out infinite;
      }

      /* Bottom sheet styling */
      .bottom-sheet {
        transition: transform 0.3s ease-out;
      }

      .drag-handle {
        width: 48px;
        height: 5px;
        background: #d1d5db;
        border-radius: 9999px;
      }

      /* Smooth image container */
      .image-container {
        position: relative;
        width: 100%;
        height: calc(100vh - 60px - 80px);
        overflow: hidden;
      }

      .instrument-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      /* Tooltip styling */
      .tooltip {
        position: absolute;
        background: white;
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        z-index: 20;
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: all 0.3s ease;
        min-width: 200px;
        max-width: 280px;
      }

      .tooltip.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .tooltip::before {
        content: "";
        position: absolute;
        bottom: 100%;
        left: 20px;
        border-width: 8px;
        border-style: solid;
        border-color: transparent transparent white transparent;
      }

      .tooltip-title {
        font-weight: 700;
        color: #111827;
        margin-bottom: 4px;
      }

      .tooltip-description {
        font-size: 0.875rem;
        color: #6b7280;
        line-height: 1.5;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen font-jakarta overflow-hidden">
    <!-- Navigation -->
    <nav class="flex items-center justify-between px-4 py-3 bg-white/80 backdrop-blur-sm fixed top-0 left-0 right-0 z-50">
      <a href="index.html" class="text-gray-700 font-medium flex items-center gap-1.5 hover:text-primary transition-colors">
        <span class="text-lg">🏠</span>
        Beranda
      </a>
      <button class="bg-primary text-white px-4 py-1.5 rounded-full text-sm font-medium flex items-center gap-1.5 shadow-md shadow-primary/20">
        Explore
        <span>🚀</span>
      </button>
    </nav>

    <!-- Main Content -->
    <main class="flex flex-col h-screen pt-[60px] overflow-hidden">
      <!-- 3D Viewer Container -->
      <div id="viewerContainer" class="flex-grow relative bg-gray-100 transition-all duration-500 ease-in-out">
        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
        <model-viewer
          id="viewer"
          src="assets/3d/calung-full.glb"
          alt="Calung Instrument 3D Model"
          auto-rotate
          camera-controls
          shadow-intensity="1"
          class="w-full h-full outline-none"
          camera-orbit="0deg 75deg 2.5m"
          field-of-view="30deg"
          interpolation-decay="200"
        >
          <button class="hotspot" slot="hotspot-1" data-position="0.03399077534060879m 0.2840307354402675m -0.008632815610825184m" data-normal="-0.0033486780006559873m 0.9999942716759267m 0.0004929208667617334m" data-instrument="1">
            <div class="hotspot-ring"></div>
            <div class="hotspot-inner"></div>
          </button>

          <button class="hotspot" slot="hotspot-2" data-position="-0.003871021270083208m 0.1994717847450865m -1.103001464517813m" data-normal="0.7734619860907876m -0.6332662095867199m 0.027027095074447175m" data-instrument="2">
            <div class="hotspot-ring"></div>
            <div class="hotspot-inner"></div>
          </button>
        </model-viewer>
      </div>

      <!-- Info Panel (Non-overlapping Bottom Sheet) -->
      <div id="bottomSheet" class="h-0 bg-white transition-all duration-500 ease-in-out overflow-hidden border-t border-gray-100">
        <div class="h-full overflow-y-auto p-6">
          <div class="max-w-2xl mx-auto">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
            <div id="sheetContent">
              <!-- Content Injected via JS -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const instrumentData = {
        1: {
          name: "Gambang",
          desc: "Gambang barung & penerus. Alat musik utama dalam ansambel calung yang terdiri dari deretan bilah bambu bernada yang dimainkan dengan cara dipukul.",
          video: "https://www.youtube.com/embed/P-A_6z2X0W0",
        },
        2: {
          name: "Dhendhem",
          desc: "Terdiri dari 6 bilah bambu berukuran besar. Berfungsi sebagai pemangku irama atau bass dalam permainan musik calung banyumasan.",
          video: "https://www.youtube.com/embed/P-A_6z2X0W0",
        },
      };

      const sheet = document.getElementById("bottomSheet");
      const content = document.getElementById("sheetContent");
      const viewer = document.getElementById("viewer");
      const viewerContainer = document.getElementById("viewerContainer");

      function openSheet(id, hotspot) {
        const data = instrumentData[id];
        if (!data) return;

        // Pan and Zoom logic: target the specific hotspot coordinate
        const pos = hotspot.dataset.position;
        viewer.cameraTarget = pos;
        viewer.cameraOrbit = "0deg 75deg 1.5m"; // Closer zoom for detail
        viewer.fieldOfView = "25deg";

        content.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-2xl font-extrabold text-gray-900">${data.name}</h3>
                    <button onclick="closeSheet()" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                        <span class="text-xl">✕</span>
                    </button>
                </div>
                <p class="text-gray-600 mb-6 leading-relaxed">${data.desc}</p>
                <div class="aspect-video w-full rounded-2xl overflow-hidden bg-gray-100 shadow-sm">
                    <iframe class="w-full h-full" src="${data.video}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            `;

        // Adjust layout so sheet doesn't cover viewer
        sheet.classList.replace("h-0", "h-1/2");
      }

      function closeSheet() {
        viewer.cameraTarget = "auto auto auto";
        viewer.cameraOrbit = "0deg 75deg 2.5m";
        viewer.fieldOfView = "30deg";

        sheet.classList.replace("h-1/2", "h-0");
        setTimeout(() => {
          content.innerHTML = "";
        }, 500);
      }

      document.querySelectorAll(".hotspot").forEach((hotspot) => {
        hotspot.addEventListener("click", () => openSheet(hotspot.dataset.instrument, hotspot));
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSheet();
      });
    </script>
  </body>
</html>
